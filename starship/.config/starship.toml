# Shared prompt config for both platforms - zsh (macOS) and PowerShell (Windows).
# Neither profile copies this file: both point STARSHIP_CONFIG straight at the
# repo, the same way they already reference other shared config in place.
#
# Sticks to Starship's own defaults everywhere, including the Nerd Font branch
# glyph (both setup scripts install FiraCode Nerd Font, so it's always there by
# the time this config is read) - except one thing with a real technical
# reason behind it, not just taste: only directory, git_branch, git_status and
# character are shown. Everything else Starship displays by default (username,
# language versions, battery, ...) is left out - a minimal, always-relevant
# prompt on purpose.
#
# $character sits on its own line rather than trailing the rest inline, which
# keeps line 1 short enough that it's less likely to wrap when the terminal is
# narrow - wrapped content is what a resize-redraw bug shared by PSReadLine,
# zsh and Readline needs to misfire (see README).
#
# Every colour, symbol and count below this point is Starship's own default -
# verified against `starship print-config --default`, not assumed.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory$git_branch$git_status
$character"""
